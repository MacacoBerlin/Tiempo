<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiempo Zaragoza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Una columna para el móvil. Arriba, un cielo que cambia con el tiempo y la frase del día.
   Debajo, tres pestañas: Hoy, Mañana y Finde. */
:root{
  --bg:#ECF1F4; --surface:#FFFFFF; --ink:#12212B; --muted:#51636F; --line:#D3DDE3;
  --accent:#1C5D8A; --accent-soft:#DCEAF3;
  --good:#176B3E; --good-soft:#DDF0E5; --warn:#865400; --warn-soft:#F7EACB; --bad:#B03333; --bad-soft:#F8DEDE;
  --c-sun:#D98E04; --c-cloud:#5C7384; --c-drop:#2B7BB9;
  --kid:#6A4BB8; --kid-soft:#EEE9FA; --on-kid:#FFFFFF; --run-soft:#E3EEF6;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1920; --surface:#16262F; --ink:#E7EFF4; --muted:#9FB3BF; --line:#2A3D49;
    --accent:#7DBCE8; --accent-soft:#1C3646;
    --good:#5CCB8D; --good-soft:#173A29; --warn:#E6B14F; --warn-soft:#3F3216; --bad:#F08A8A; --bad-soft:#442022;
    --c-sun:#FFC247; --c-cloud:#A9BCC8; --c-drop:#7DBCE8;
    --kid:#B9A6F5; --kid-soft:#262040; --on-kid:#1C1534; --run-soft:#16303F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ----- Cielo ----- */
.hero{
  --g1:#1B6AA3; --g2:#3E8EC8; color:#fff;
  background:radial-gradient(120% 90% at 88% -5%,rgba(255,255,255,.30),rgba(255,255,255,0) 55%),linear-gradient(165deg,var(--g1),var(--g2));
  padding-top:max(16px,env(safe-area-inset-top,0px)); padding-bottom:58px; border-radius:0 0 30px 30px;
}
.hero[data-sky="cloud"]{--g1:#46596A;--g2:#6B8191}
.hero[data-sky="rain"]{--g1:#2B3F55;--g2:#4C657B}
.hero[data-sky="storm"]{--g1:#2A2D4A;--g2:#52567C}
.hero[data-sky="night"]{--g1:#0F1D38;--g2:#2B4670}
.hero-in{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.place{font:800 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.stamp{font-size:14px;opacity:.92;margin-top:2px;overflow-wrap:anywhere}
.refresh{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:8px 14px;min-height:40px;flex:none}
.now{display:flex;align-items:center;gap:14px}
.nowtemp{font:800 clamp(52px,16vw,72px)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nowtemp.sm{font-size:clamp(34px,10.5vw,46px);white-space:nowrap}
.nowtxt{font-size:17px;font-weight:700}
.nowsub{font-size:15px;opacity:.95}
.meta{font-size:14px;opacity:.95;margin:0}
h1{font:800 clamp(25px,7vw,34px)/1.12 var(--f-display);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}

/* ----- Iconos del tiempo ----- */
.wi{flex:none}
.wi .sun{stroke:var(--c-sun)} .wi .cl{stroke:var(--c-cloud)} .wi .dr{stroke:var(--c-drop)}
.wi .dot{stroke-width:2.6}
.hero .wi .sun{stroke:#FFD35C;fill:rgba(255,211,92,.22)}
.hero .wi .cl{stroke:#fff;fill:rgba(255,255,255,.2)}
.hero .wi .dr{stroke:#CDE7FF}
.gi{flex:none;fill:var(--accent-soft);stroke:var(--ink)}
.gi .nf{fill:none}

/* ----- Estructura ----- */
.wrap{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:0 max(44px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-top:-30px;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(10,30,50,.14);
}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 4px;min-height:46px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
h2{font:700 19px/1.2 var(--f-display);margin:0 0 10px}
section{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:340px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.past{opacity:.55}
.when{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.range{font-size:13px;color:var(--muted)}
.big{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:10px 0 2px}
.big.sm{font-size:28px;margin:0}
.small{color:var(--muted);font-size:14px}
.garment{font:700 19px/1.2 var(--f-display);margin:10px 0 8px}
.kid-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:1.25;padding:4px 10px;border-radius:999px;background:var(--accent-soft)}
.chip.alert{background:var(--warn-soft);color:var(--warn);font-weight:700}
.ui{flex:none}
.note{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:15px}
.pill{display:inline-block;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.ok{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.msg{margin:0;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

/* ----- Avance del finde (en Hoy y Mañana) ----- */
.teaser{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;width:100%;text-align:left}
.teaser .trow{display:flex;gap:16px;align-items:center}
.ti{display:inline-flex;align-items:center;gap:5px;font-size:16px}
.tverdict{font-weight:700;color:var(--accent)}
.teaser .when{flex-basis:100%}

/* ----- Correr ----- */
.run-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.window{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin:14px 0}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:16px;line-height:1.2;white-space:nowrap}
.stat span{font-size:12.5px;color:var(--muted)}
.outfit{margin:0 0 14px;font-size:16px}
.strip{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:3px;align-items:end;height:84px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.col.past{opacity:.35}
.bar{width:100%;border-radius:4px 4px 2px 2px}
.bar.good{background:var(--good)} .bar.ok{background:var(--warn)} .bar.bad{background:var(--bad)}
.col.dark .bar{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 3px,rgba(255,255,255,0) 3px 6px)}
.col.best .bar{outline:2px solid var(--ink);outline-offset:1px}
.col span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ----- Finde ----- */
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dname{font:800 24px/1.1 var(--f-display);text-transform:capitalize}
.dright{display:flex;align-items:center;gap:8px}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0 12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.slotv{display:flex;align-items:center;gap:8px;margin:2px 0}
.slotv b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.lbl{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rstrip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;align-items:end;height:66px}
.rcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.rbar{width:100%;border-radius:3px 3px 1px 1px;background:var(--c-drop)}
.rcol span{font-size:11px;color:var(--muted);height:13px;font-variant-numeric:tabular-nums}
.kidline{display:flex;align-items:center;gap:10px;margin-top:14px}
.kidline .chips{flex:1}
.far{margin:10px 0 0}
/* ----- Niños (violeta) y correr (azul): cada uno con su etiqueta, su cabecera y su fondo ----- */
.tag{display:inline-block;text-align:center;font:800 12px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.tag.kid{background:var(--kid);color:var(--on-kid)}
.tag.run{background:var(--accent);color:var(--surface)}
.brief{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.brow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;align-items:start}
.brow .tag{margin-top:2px}
.brow p{margin:0;font-size:19px;line-height:1.3;font-weight:700;text-wrap:balance}
.hero .tag{background:#fff}
.hero .tag.kid{color:#5B3DA8}
.hero .tag.run{color:#1B5E94}
.sec-head{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sec-head h2{margin:0}
.sec-head .small{display:block;line-height:1.25}
.badge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.badge.kid{background:var(--kid);color:var(--on-kid)}
.badge.run{background:var(--accent);color:var(--surface)}
.badge .gi{fill:none;stroke:currentColor}
.kidsec .card{background:var(--kid-soft);border-color:transparent}
.kidsec .gi{fill:var(--surface)}
.kidsec .chip{background:var(--surface)}
.kidsec .note{background:var(--kid-soft)}
.runsec .card{background:var(--run-soft);border-color:transparent}
.runsec .stat{background:var(--surface)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:340px){.figs{grid-template-columns:1fr}}
.fig{background:var(--kid-soft);border-radius:16px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.fig.past{opacity:.55}
.figt{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;width:100%;text-align:left}
.figt .when{font-size:12px;letter-spacing:.04em}
.kidfig{width:100%;max-width:96px;height:auto;margin:4px 0 2px}
.figbg{fill:var(--surface);opacity:.7}
.figtemp{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.figword{font:700 16px/1.2 var(--f-display);margin-bottom:2px}
.fl{font-size:13px;line-height:1.25;padding:3px 8px;border-radius:999px;background:var(--surface)}
.fl.alert{background:var(--warn-soft);color:var(--warn);font-weight:700}
.kidlbl{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.day .kidline{margin-top:0;padding:10px;border-radius:12px;background:var(--kid-soft)}
.day .kidline .gi{fill:var(--surface)}
.day .kidline .chip{background:var(--surface)}
.foot{color:var(--muted);font-size:13px;margin:0}
</style>
</head>
<body>
<header class="hero" id="hero" data-sky="clear">
  <div class="hero-in">
    <div class="hero-top">
      <div>
        <div class="place">Zaragoza</div>
        <div class="stamp" id="stamp">Cargando el tiempo…</div>
      </div>
      <button class="refresh" id="refresh" type="button">Actualizar</button>
    </div>
    <div id="hero-body"><h1>Cargando el tiempo de Zaragoza…</h1></div>
  </div>
</header>

<main class="wrap">
  <div class="seg" role="group" aria-label="Qué día mirar">
    <button type="button" id="b-today" aria-pressed="true">Hoy</button>
    <button type="button" id="b-tomorrow" aria-pressed="false">Mañana</button>
    <button type="button" id="b-weekend" aria-pressed="false">Finde</button>
  </div>
  <div id="view" style="display:flex;flex-direction:column;gap:22px"></div>
  <p class="foot">Datos de Open-Meteo. La sensación térmica ya cuenta el viento y la humedad. Los horarios del cole y la ciudad se cambian al principio del script.</p>
</main>

<script>
/* ---------- Ajustes que puedes cambiar ---------- */
const PLACE  = { name: 'Zaragoza', lat: 41.6488, lon: -0.8891 };
const TZ     = 'Europe/Madrid';
const SCHOOL = { entrada: 9, recreo: 11, salida: 17 };   // horas del cole (en punto)

/* ---------- Datos ---------- */
const API = 'https://api.open-meteo.com/v1/forecast?latitude=' + PLACE.lat + '&longitude=' + PLACE.lon +
  '&current=temperature_2m,apparent_temperature,weather_code,is_day' +
  '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunrise,sunset' +
  '&timezone=Europe%2FMadrid&forecast_days=8&wind_speed_unit=kmh';
const CACHE_KEY = 'tiempo-zgz-v2';
const HASHES = { hoy: 'today', manana: 'tomorrow', finde: 'weekend' };

const $ = (id) => document.getElementById(id);
let S = null;      // datos ya ordenados
let NOW = null;    // fecha y hora actuales en Madrid
let view = 'today';// 'today' | 'tomorrow' | 'weekend'

function nowMadrid() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = (t) => parts.find((x) => x.type === t).value;
  return { date: g('year') + '-' + g('month') + '-' + g('day'), h: +g('hour'), m: +g('minute') };
}
function addDays(date, n) { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(date) { return new Date(date + 'T12:00:00Z').getUTCDay(); } // 0 = domingo
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5); }
function dateLabel(date, opts) { return new Intl.DateTimeFormat('es-ES', Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(date + 'T12:00:00Z')); }
const fmt = (n) => Math.round(n);
const deg = (n) => fmt(n) + ' °C';
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const isRainCode = (c) => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const clock = (s) => (s ? +s.slice(11, 13) + (+s.slice(14, 16)) / 60 : null);

function parse(raw) {
  const H = raw.hourly, D = raw.daily, hours = {}, days = {};
  H.time.forEach((t, i) => {
    const date = t.slice(0, 10), h = +t.slice(11, 13), code = H.weather_code[i];
    const mm = H.precipitation[i] == null ? 0 : H.precipitation[i];
    const p = H.precipitation_probability[i];
    const temp = H.temperature_2m[i];
    (hours[date] = hours[date] || [])[h] = {
      h, temp, feel: H.apparent_temperature[i] == null ? temp : H.apparent_temperature[i],
      pp: p == null ? (isRainCode(code) ? 65 : mm >= 0.2 ? 45 : 8) : p,   // si falta la probabilidad, se estima con el código del cielo
      mm, code, wind: H.wind_speed_10m[i] || 0, gust: H.wind_gusts_10m[i] || 0, dir: H.wind_direction_10m[i] || 0
    };
  });
  D.time.forEach((date, i) => {
    const hs = (hours[date] || []).filter(Boolean);
    days[date] = {
      date, code: D.weather_code[i], tmax: D.temperature_2m_max[i], tmin: D.temperature_2m_min[i],
      pp: D.precipitation_probability_max[i] == null ? Math.max.apply(null, hs.map((x) => x.pp).concat([0])) : D.precipitation_probability_max[i],
      mm: D.precipitation_sum[i] == null ? hs.reduce((a, x) => a + x.mm, 0) : D.precipitation_sum[i],
      gust: D.wind_gusts_10m_max[i] || 0,
      rise: clock(D.sunrise && D.sunrise[i]), set: clock(D.sunset && D.sunset[i]),
      riseTxt: D.sunrise && D.sunrise[i] ? D.sunrise[i].slice(11, 16) : '', setTxt: D.sunset && D.sunset[i] ? D.sunset[i].slice(11, 16) : ''
    };
  });
  const c = raw.current;
  return { hours, days, current: c ? { temp: c.temperature_2m, feel: c.apparent_temperature, code: c.weather_code, night: c.is_day === 0 } : null };
}

/* Resumen de un tramo de horas: sensación, lluvia, viento. */
function agg(date, h0, h1) {
  const hs = (S.hours[date] || []).filter((x) => x && x.h >= h0 && x.h <= h1);
  if (!hs.length) return null;
  const sum = (k) => hs.reduce((a, x) => a + x[k], 0);
  const avg = (k) => sum(k) / hs.length;
  const windy = hs.reduce((a, b) => (b.gust > a.gust ? b : a));
  const wet = hs.reduce((a, b) => (b.pp > a.pp ? b : a));
  const mid = hs[Math.floor(hs.length / 2)];
  return {
    h0, h1, feelAvg: avg('feel'), tempAvg: avg('temp'), pp: Math.max.apply(null, hs.map((x) => x.pp)),
    mm: sum('mm'), gust: windy.gust, windAvg: avg('wind'), dir: windy.dir, code: wet.pp >= 40 ? wet.code : mid.code
  };
}

/* ---------- Iconos y textos del cielo ---------- */
function kind(code) {
  if (code <= 1) return 'sun';
  if (code === 2) return 'partly';
  if (code === 3) return 'cloud';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 67) return 'rain';
  if (code >= 71 && code <= 77) return 'snow';
  if (code >= 80 && code <= 82) return 'rain';
  if (code === 85 || code === 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloud';
}
const TEXT = { sun: 'Despejado', partly: 'Nubes y claros', cloud: 'Nublado', fog: 'Niebla', rain: 'Lluvia', snow: 'Nieve', storm: 'Tormenta' };
const CLOUD_LO = 'M7.5 18.5h9a4 4 0 0 0 .6-7.95 5.5 5.5 0 0 0-10.6 1.5A3.25 3.25 0 0 0 7.5 18.5z';
const CLOUD_HI = 'M7.5 14.5h9a4 4 0 0 0 .6-7.95 5.5 5.5 0 0 0-10.6 1.5A3.25 3.25 0 0 0 7.5 14.5z';
const CLOUD_SM = 'M9.5 20h8a3.5 3.5 0 0 0 .5-6.96 4.8 4.8 0 0 0-9.2 1.3A3 3 0 0 0 9.5 20z';
const MOON = 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z';
const ICONS = {
  sun: '<g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>',
  moon: '<path class="sun" d="' + MOON + '"/>',
  partly: '<g class="sun"><circle cx="8" cy="8" r="2.8"/><path d="M8 2v1.4M2 8h1.4M3.8 3.8l1 1M12.2 3.8l-1 1"/></g><path class="cl" d="' + CLOUD_SM + '"/>',
  partlyNight: '<path class="sun" d="M10.5 3a5 5 0 1 0 3 8.6A4.2 4.2 0 0 1 10.5 3z"/><path class="cl" d="' + CLOUD_SM + '"/>',
  cloud: '<path class="cl" d="' + CLOUD_LO + '"/>',

  const dayInfo = S.days[date];
  const hrs = (S.hours[date] || []).filter((x) => x && x.h >= 6 && x.h <= 22).map((x) => {
    const dark = isDark(dayInfo, x.h);
    return Object.assign({ dark, score: runScore(x, dark) }, x);
  });
  const first = isToday ? NOW.h + (NOW.m >= 30 ? 1 : 0) : 6;

}

  const pp = Math.max(best.a.pp, best.b.pp);
  const gust = Math.max(best.a.gust, best.b.gust);

  const dir = best.a.gust >= best.b.gust ? best.a.dir : best.b.dir;

  const bars = hrs.map((x) => {
    const inBest = pair.indexOf(x) !== -1;
    return '<div class="col' + (x.h < first ? ' past' : '') + (x.dark ? ' dark' : '') + (inBest ? ' best' : '') + '" title="' + x.h + ':00 · ' + fmt(x.feel) + ' °C · lluvia ' + x.pp + ' %">' +

    '<div class="dh"><div><div class="dname">' + dateLabel(date, { weekday: 'long' }) + '</div><div class="range">' + dateLabel(date, { day: 'numeric', month: 'long' }) + '</div></div>' +
    '<div class="dright">' + icon(d.code, 40) + '<div><div class="big sm">' + fmt(d.tmin) + '–' + deg(d.tmax) + '</div><div class="small">' + TEXT[kind(d.code)] + '</div></div></div></div>' +
    '<div class="verdict"><span class="pill ' + di.bd + '">' + OUT_VERDICT[di.bd] + '</span><span class="small">' + di.reason + '</span></div>' +
    '<div class="two">' + slot('Mañana · 10–14 h', m) + slot('Tarde · 15–19 h', t) + '</div>' +
    '<div class="lbl">Lluvia por horas</div><div class="rstrip" role="img" aria-label="Probabilidad de lluvia de 8 a 20 horas">' + bars + '</div>' +
    '<div class="kidlbl"><span class="tag kid">Niños</span><span class="small">Qué ponerles ese día</span></div>' +
    '<div class="kidline">' + gicon(g.main, 40) + '<div class="chips"><span class="chip"><b>' + cap(g.main) + '</b></span>' + slotChips(o) + '</div></div>' +
    (di.ahead >= 5 ? '<p class="small far">Previsión a ' + di.ahead + ' días: puede cambiar.</p>' : '') +
    '</article>';
}
function teaser(wk) {
  const item = (lab, di) => '<span class="ti">' + lab + icon(di.d.code, 24) + '<b>' + fmt(di.d.tmax) + '°</b></span>';
  return '<button type="button" class="card teaser" id="to-weekend"><div class="when">' + wk.title + '</div>' +
    '<div class="trow">' + item('Sáb ', wk.a) + item('Dom ', wk.b) + '</div><div class="tverdict">' + wk.short + ' ›</div></button>';
}

/* ---------- Pintar la página ---------- */
function safe(fn, what) {
  try { return fn(); } catch (e) { return '<p class="msg">No he podido mostrar ' + what + ': ' + e.message + '</p>'; }
}
function heroHtml(o) {
  return '<div class="now">' + o.icon + '<div><div class="nowtemp' + (o.bigSm ? ' sm' : '') + '">' + o.big + '</div><div class="nowtxt">' + o.txt + '</div>' +
    (o.sub ? '<div class="nowsub">' + o.sub + '</div>' : '') + '</div></div>' +
    (o.meta ? '<p class="meta">' + o.meta + '</p>' : '') + '<h1>' + o.headline + '</h1>' + (o.brief || '');
}
const RUNNER = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="4.5" r="1.9"/><path d="M12.5 8.5l-2.8 3 3 2.4-1.4 5.6M12.5 8.5l3.6 2.2 2.4-1.2M9.7 11.5L6 12.6M13.1 14.1l3.6 1.9-.6 4.2"/></svg>';
function sectionHead(kindName, title, sub) {
  const ico = kindName === 'kid' ? '<svg class="gi" width="30" height="30" viewBox="0 0 32 32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + GARMENTS.tee + '</svg>' : RUNNER;
  return '<div class="sec-head"><span class="badge ' + kindName + '">' + ico + '</span><div><h2 id="h-' + kindName + '">' + title + '</h2><span class="small">' + sub + '</span></div></div>';
}
function briefRows(kidsTxt, runTxt) {
  return '<div class="brief"><div class="brow"><span class="tag kid">Niños</span><p>' + kidsTxt + '</p></div>' +
    '<div class="brow"><span class="tag run">Correr</span><p>' + runTxt + '</p></div></div>';
}
function setHero(skyName, html) { $('hero').setAttribute('data-sky', skyName); $('hero-body').innerHTML = html; }

function renderDayView() {
  const isToday = view === 'today';
  const date = isToday ? NOW.date : addDays(NOW.date, 1);
  const day = S.days[date];
  const ks = SLOTS.map((s, i) => ({ s, i, a: agg(date, s.h, s.h), past: isToday && s.h < NOW.h }));
  if (!day || ks.some((k) => !k.a)) {
    setHero('cloud', '<h1>Estos datos han caducado. Pulsa Actualizar con conexión.</h1>');
    $('view').innerHTML = '';
    return;
  }
  const label = (isToday ? 'Hoy ' : 'Mañana ') + dateLabel(date, { weekday: 'long' });
  const sunTxt = day.riseTxt ? 'Amanece ' + day.riseTxt + ' · Anochece ' + day.setTxt : '';

  let o;
  if (isToday) {
    const hr = (S.hours[date] || [])[NOW.h];
    const c = S.current || (hr ? { temp: hr.temp, feel: hr.feel, code: hr.code, night: isDark(day, NOW.h) } : { temp: day.tmax, feel: day.tmax, code: day.code, night: false });
    o = { icon: icon(c.code, 92, c.night), big: fmt(c.temp) + '°', txt: TEXT[kind(c.code)], sub: 'Hoy ' + fmt(day.tmin) + '–' + deg(day.tmax),
      meta: 'Sensación ' + deg(c.feel) + (sunTxt ? ' · ' + sunTxt : ''), sky: skyOf(c.code, c.night) };
  } else {
    o = { icon: icon(day.code, 92, false), big: fmt(day.tmin) + '–' + fmt(day.tmax) + '°', txt: TEXT[kind(day.code)], sub: '', meta: sunTxt, sky: skyOf(day.code, false) };
  }
  o.headline = label;
  o.brief = briefRows(kidsSummary(ks), runSummary(date, isToday));
  setHero(o.sky, heroHtml(o));

  const kids = safe(() => {
    let h = '<div class="figs">' + ks.map((k) => figCard(k.s, k.a, k.past, day)).join('') + '</div>';
    const fs = ks.filter((k) => !k.past).map((k) => k.a.feelAvg);
    const swing = fs.length > 1 ? Math.max.apply(null, fs) - Math.min.apply(null, fs) : 0;
    if (swing >= 7) h += '<p class="note">Por capas: entre la hora más fresca y la más templada hay ' + fmt(swing) + ' grados. Que puedan quitarse la prenda de arriba.</p>';
    return h;
  }, 'la ropa de los niños');
  const run = safe(() => renderRun(date, isToday), 'el mejor momento para correr');
  const tz = safe(() => { const wk = weekendInfo(); return wk ? teaser(wk) : ''; }, 'el avance del fin de semana');

  $('view').innerHTML = tz +
    '<section class="kidsec" aria-labelledby="h-kid">' + sectionHead('kid', 'Ropa de los niños', 'Entrada, recreo y salida del cole') + kids + '</section>' +
    '<section class="runsec" aria-labelledby="h-run">' + sectionHead('run', 'Salir a correr', 'Para ti: mejor hora y qué ponerte') + run + '</section>';
}

function renderWeekendView() {
  const wk = weekendInfo();
  if (!wk) {
    setHero('cloud', '<h1>Aún no hay previsión para el fin de semana.</h1>');
    $('view').innerHTML = '';
    return;
  }
  const bt = wk.better.d;
  setHero(skyOf(bt.code, false), heroHtml({
    icon: icon(bt.code, 92, false), big: fmt(wk.a.d.tmax) + '° · ' + fmt(wk.b.d.tmax) + '°', bigSm: true, txt: 'Máximas de sábado y domingo', sub: '',
    meta: wk.title + ': ' + dateLabel(wk.w.sat, { day: 'numeric' }) + ' y ' + dateLabel(wk.w.sun, { day: 'numeric', month: 'long' }),
    headline: wk.hl
  }));
  $('view').innerHTML = safe(() => weekendCard(wk.a) + weekendCard(wk.b), 'el fin de semana');
}

function render() {
  NOW = nowMadrid();
  ['today', 'tomorrow', 'weekend'].forEach((v) => $('b-' + v).setAttribute('aria-pressed', String(view === v)));
  if (view === 'weekend') renderWeekendView(); else renderDayView();
}
function setView(v) {
  view = v;
  try { history.replaceState(null, '', '#' + Object.keys(HASHES).find((k) => HASHES[k] === v)); } catch (e) {}
  if (S) render();
}

/* ---------- Carga, caché y errores ---------- */
const timeOf = (ms) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(ms));
const dayOf = (ms) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'short' }).format(new Date(ms));

async function load() {
  $('stamp').textContent = 'Actualizando…';
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    S = parse(raw); S.at = Date.now();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: S.at, raw })); } catch (e) {}
    $('stamp').textContent = 'Actualizado a las ' + timeOf(S.at);
    render();
  } catch (err) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
    if (cached && cached.raw) {
      S = parse(cached.raw); S.at = cached.at;
      $('stamp').textContent = 'Sin conexión. Datos de las ' + timeOf(S.at) + ' del ' + dayOf(S.at);
      render();
    } else {
      setHero('cloud', '<h1>No he podido cargar el tiempo.</h1>');
      $('stamp').textContent = 'Ábrela en el navegador y con conexión. Desde una vista previa no puede pedir datos.';
    }
  }
}

$('refresh').addEventListener('click', load);
$('b-today').addEventListener('click', () => setView('today'));
$('b-tomorrow').addEventListener('click', () => setView('tomorrow'));
$('b-weekend').addEventListener('click', () => setView('weekend'));
$('view').addEventListener('click', (e) => { if (e.target.closest && e.target.closest('#to-weekend')) setView('weekend'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && Date.now() - S.at > 30 * 60 * 1000) load(); });

const fromHash = HASHES[(location.hash || '').replace('#', '')];
view = fromHash || (nowMadrid().h >= 15 ? 'tomorrow' : 'today');  // por la tarde interesa más mañana
load();
</script>
</body>
</html>
