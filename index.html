<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiempo Zaragoza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Una columna para el móvil. Arriba, un cielo que cambia con el tiempo y la frase del día.
   Debajo, tres pestañas: Hoy, Mañana y Finde. */
:root{
  --bg:#ECF1F4; --surface:#FFFFFF; --ink:#12212B; --muted:#51636F; --line:#D3DDE3;
  --accent:#1C5D8A; --accent-soft:#DCEAF3;
  --good:#176B3E; --good-soft:#DDF0E5; --warn:#865400; --warn-soft:#F7EACB; --bad:#B03333; --bad-soft:#F8DEDE;
  --c-sun:#D98E04; --c-cloud:#5C7384; --c-drop:#2B7BB9;
  --kid:#6A4BB8; --kid-soft:#EEE9FA; --on-kid:#FFFFFF; --run-soft:#E3EEF6;
  --trip:#0F7B6C; --trip-soft:#DDF1EC; --on-trip:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1920; --surface:#16262F; --ink:#E7EFF4; --muted:#9FB3BF; --line:#2A3D49;
    --accent:#7DBCE8; --accent-soft:#1C3646;
    --good:#5CCB8D; --good-soft:#173A29; --warn:#E6B14F; --warn-soft:#3F3216; --bad:#F08A8A; --bad-soft:#442022;
    --c-sun:#FFC247; --c-cloud:#A9BCC8; --c-drop:#7DBCE8;
    --kid:#B9A6F5; --kid-soft:#262040; --on-kid:#1C1534; --run-soft:#16303F;
    --trip:#6FD3C0; --trip-soft:#15352F; --on-trip:#06231E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ----- Cielo ----- */
.hero{
  --g1:#1B6AA3; --g2:#3E8EC8; color:#fff;
  background:radial-gradient(120% 90% at 88% -5%,rgba(255,255,255,.30),rgba(255,255,255,0) 55%),linear-gradient(165deg,var(--g1),var(--g2));
  padding-top:max(16px,env(safe-area-inset-top,0px)); padding-bottom:58px; border-radius:0 0 30px 30px;
}
.hero[data-sky="cloud"]{--g1:#46596A;--g2:#6B8191}
.hero[data-sky="rain"]{--g1:#2B3F55;--g2:#4C657B}
.hero[data-sky="storm"]{--g1:#2A2D4A;--g2:#52567C}
.hero[data-sky="night"]{--g1:#0F1D38;--g2:#2B4670}
.hero-in{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.place{font:800 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.stamp{font-size:14px;opacity:.92;margin-top:2px;overflow-wrap:anywhere}
.refresh{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:8px 14px;min-height:40px;flex:none}
.now{display:flex;align-items:center;gap:14px}
.nowtemp{font:800 clamp(52px,16vw,72px)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nowtemp.sm{font-size:clamp(34px,10.5vw,46px);white-space:nowrap}
.nowtxt{font-size:17px;font-weight:700}
.nowsub{font-size:15px;opacity:.95}
.meta{font-size:14px;opacity:.95;margin:0}
h1{font:800 clamp(25px,7vw,34px)/1.12 var(--f-display);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}

/* ----- Iconos del tiempo ----- */
.wi{flex:none}
.wi .sun{stroke:var(--c-sun)} .wi .cl{stroke:var(--c-cloud)} .wi .dr{stroke:var(--c-drop)}
.wi .dot{stroke-width:2.6}
.hero .wi .sun{stroke:#FFD35C;fill:rgba(255,211,92,.22)}
.hero .wi .cl{stroke:#fff;fill:rgba(255,255,255,.2)}
.hero .wi .dr{stroke:#CDE7FF}
.gi{flex:none;fill:var(--accent-soft);stroke:var(--ink)}
.gi .nf{fill:none}

/* ----- Estructura ----- */
.wrap{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:0 max(44px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.seg{
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:4px;margin-top:-30px;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(10,30,50,.14);
}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 2px;min-height:46px;min-width:0;font-weight:700;font-size:14.5px}
@media (max-width:360px){.seg button{font-size:13px}}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
h2{font:700 19px/1.2 var(--f-display);margin:0 0 10px}
section{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:340px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.past{opacity:.55}
.when{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.range{font-size:13px;color:var(--muted)}
.big{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:10px 0 2px}
.big.sm{font-size:28px;margin:0}
.small{color:var(--muted);font-size:14px}
.garment{font:700 19px/1.2 var(--f-display);margin:10px 0 8px}
.kid-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:1.25;padding:4px 10px;border-radius:999px;background:var(--accent-soft)}
.chip.alert{background:var(--warn-soft);color:var(--warn);font-weight:700}
.ui{flex:none}
.note{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:15px}
.pill{display:inline-block;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.ok{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.msg{margin:0;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

/* ----- Avance del finde (en Hoy y Mañana) ----- */
.teaser{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;width:100%;text-align:left}
.teaser .trow{display:flex;gap:16px;align-items:center}
.ti{display:inline-flex;align-items:center;gap:5px;font-size:16px}
.tverdict{font-weight:700;color:var(--accent)}
.teaser .when{flex-basis:100%}

/* ----- Correr ----- */
.run-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.window{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin:14px 0}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:16px;line-height:1.2;white-space:nowrap}
.stat span{font-size:12.5px;color:var(--muted)}
.outfit{margin:0 0 14px;font-size:16px}
.strip{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:3px;align-items:end;height:84px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.col.past{opacity:.35}
.bar{width:100%;border-radius:4px 4px 2px 2px}
.bar.good{background:var(--good)} .bar.ok{background:var(--warn)} .bar.bad{background:var(--bad)}
.col.dark .bar{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 3px,rgba(255,255,255,0) 3px 6px)}
.col.best .bar{outline:2px solid var(--ink);outline-offset:1px}
.col span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ----- Finde ----- */
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dname{font:800 24px/1.1 var(--f-display);text-transform:capitalize}
.dright{display:flex;align-items:center;gap:8px}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0 12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.slotv{display:flex;align-items:center;gap:8px;margin:2px 0}
.slotv b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.lbl{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rstrip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;align-items:end;height:66px}
.rcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.rbar{width:100%;border-radius:3px 3px 1px 1px;background:var(--c-drop)}
.rcol span{font-size:11px;color:var(--muted);height:13px;font-variant-numeric:tabular-nums}
.kidline{display:flex;align-items:center;gap:10px;margin-top:14px}
.kidline .chips{flex:1}
.far{margin:10px 0 0}
/* ----- Niños (violeta) y correr (azul): cada uno con su etiqueta, su cabecera y su fondo ----- */
.tag{display:inline-block;text-align:center;font:800 12px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.tag.kid{background:var(--kid);color:var(--on-kid)}
.tag.run{background:var(--accent);color:var(--surface)}
.brief{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.brow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;align-items:start}
.brow .tag{margin-top:2px}
.brow p{margin:0;font-size:19px;line-height:1.3;font-weight:700;text-wrap:balance}
.hero .tag{background:#fff}
.hero .tag.kid{color:#5B3DA8}
.hero .tag.run{color:#1B5E94}
.sec-head{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sec-head h2{margin:0}
.sec-head .small{display:block;line-height:1.25}
.badge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.badge.kid{background:var(--kid);color:var(--on-kid)}
.badge.run{background:var(--accent);color:var(--surface)}
.badge .gi{fill:none;stroke:currentColor}
.kidsec .card{background:var(--kid-soft);border-color:transparent}
.kidsec .gi{fill:var(--surface)}
.kidsec .chip{background:var(--surface)}
.kidsec .note{background:var(--kid-soft)}
.runsec .card{background:var(--run-soft);border-color:transparent}
.runsec .stat{background:var(--surface)}
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;align-items:center;background:var(--kid-soft);border-radius:18px;padding:10px 12px}
.mrow.past{opacity:.55}
.pair{width:100%;height:auto;display:block}
.minfo{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%}
.figtemp{font:800 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.figword{font:700 18px/1.15 var(--f-display)}
.fl{font-size:13px;line-height:1.25;padding:3px 9px;border-radius:999px;background:var(--surface)}
.fl.alert{background:var(--warn-soft);color:var(--warn);font-weight:700}
.kidlbl{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.day .kidline{margin-top:0;padding:10px;border-radius:12px;background:var(--kid-soft)}
.day .kidline .gi{fill:var(--surface)}
.day .kidline .chip{background:var(--surface)}
/* ----- Semana (neutra) y viaje (verde azulado) ----- */
.badge.week{background:var(--ink);color:var(--surface)}
.badge.trip{background:var(--trip);color:var(--on-trip)}
.wcard,.tripcard{padding:8px}
.whead,.wrow{display:grid;grid-template-columns:50px 30px 64px 52px minmax(0,1fr);gap:6px;align-items:center}
.whead{padding:6px 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.whead .tag{padding:4px 8px;font-size:11px}
.wrow{padding:9px 8px;border-top:1px solid var(--line);border-radius:10px}
.wrow.we{background:var(--accent-soft)}
.wrow.sel{background:var(--trip-soft)}
.wrow.out{opacity:.5}
.wrow.today .wd b{color:var(--accent)}
.wd b{display:block;font-size:16px;line-height:1.1}
.wd span{font-size:12.5px;color:var(--muted)}
.wt b{font:800 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wt span{font-size:14px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.wr{display:inline-flex;align-items:center;gap:3px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.wr.hi{color:var(--c-drop);font-weight:700}
.wk{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;line-height:1.2}
.wk .gi{fill:var(--kid-soft)}
.wk .ui{color:var(--warn);vertical-align:-2px}
.wl{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tform{display:flex;gap:8px}
.tform input{flex:1;min-width:0;font:inherit;padding:12px 14px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.go{flex:none;border:0;border-radius:12px;padding:0 18px;min-height:48px;background:var(--trip);color:var(--on-trip);font-weight:700}
.rec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
button.chip{border:0;background:var(--trip-soft);color:var(--ink);min-height:34px}
.res{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.res button{width:100%;text-align:left;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:50px}
.res span{color:var(--muted);font-size:14px}
.tripsec .card{margin-top:12px}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.dates input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;min-height:44px}
.packs{display:flex;flex-wrap:wrap;gap:6px}
.packs .chip{background:var(--trip-soft)}
.packs .chip.alert{background:var(--warn-soft)}
.msg.err{color:var(--bad)}
.foot{color:var(--muted);font-size:13px;margin:0}
</style>
</head>
<body>
<header class="hero" id="hero" data-sky="clear">
  <div class="hero-in">
    <div class="hero-top">
      <div>
        <div class="place" id="place">Zaragoza</div>
        <div class="stamp" id="stamp">Cargando el tiempo…</div>
      </div>
      <button class="refresh" id="refresh" type="button">Actualizar</button>
    </div>
    <div id="hero-body"><h1>Cargando el tiempo de Zaragoza…</h1></div>
  </div>
</header>

<main class="wrap">
  <div class="seg" role="group" aria-label="Qué mirar">
    <button type="button" id="b-today" aria-pressed="true">Hoy</button>
    <button type="button" id="b-tomorrow" aria-pressed="false">Mañana</button>
    <button type="button" id="b-week" aria-pressed="false">Semana</button>
    <button type="button" id="b-weekend" aria-pressed="false">Finde</button>
    <button type="button" id="b-trip" aria-pressed="false">Viaje</button>
  </div>
  <div id="view" style="display:flex;flex-direction:column;gap:22px"></div>
  <p class="foot">Datos de Open-Meteo. La sensación térmica ya cuenta el viento y la humedad. Las horas del cole, la ciudad y los colores de los niños se cambian al principio del script.</p>
</main>

<script>
/* ---------- Ajustes que puedes cambiar ---------- */
const PLACE  = { name: 'Zaragoza', lat: 41.6488, lon: -0.8891 };
const TZ     = 'Europe/Madrid';
const SCHOOL = { entrada: 9, recreo: 11, salida: 17 };   // horas del cole (en punto)

/* ---------- Datos ---------- */
const API = 'https://api.open-meteo.com/v1/forecast?latitude=' + PLACE.lat + '&longitude=' + PLACE.lon +
  '&current=temperature_2m,apparent_temperature,weather_code,is_day' +
  '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunrise,sunset' +
  '&timezone=Europe%2FMadrid&forecast_days=8&wind_speed_unit=kmh';
const CACHE_KEY = 'tiempo-zgz-v2';
const HASHES = { hoy: 'today', manana: 'tomorrow', semana: 'week', finde: 'weekend', viaje: 'trip' };

const $ = (id) => document.getElementById(id);
let STAMP = 'Cargando el tiempo…';
function paintHeader() {
  const trip = view === 'trip';
  $('place').textContent = trip && T.place ? T.place.name : trip ? 'Viaje' : PLACE.name;
  $('stamp').textContent = trip ? (T.place ? 'Previsión de Open-Meteo para este lugar' : 'Mira el tiempo de otro sitio') : STAMP;
}
function setStamp(t) { STAMP = t; paintHeader(); }
let S = null;      // datos ya ordenados
let NOW = null;    // fecha y hora actuales en Madrid
let view = 'today';// 'today' | 'tomorrow' | 'week' | 'weekend' | 'trip'

function nowMadrid() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = (t) => parts.find((x) => x.type === t).value;
  return { date: g('year') + '-' + g('month') + '-' + g('day'), h: +g('hour'), m: +g('minute') };
}
function addDays(date, n) { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(date) { return new Date(date + 'T12:00:00Z').getUTCDay(); } // 0 = domingo
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5); }
function dateLabel(date, opts) { return new Intl.DateTimeFormat('es-ES', Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(date + 'T12:00:00Z')); }
const fmt = (n) => Math.round(n);
const rng = (a, b) => (fmt(a) < 0 ? fmt(a) + '° a ' + fmt(b) : fmt(a) + '–' + fmt(b)) + '°';   // 5–14° o, con heladas, -3° a 14°
const deg = (n) => fmt(n) + ' °C';
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const isRainCode = (c) => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const clock = (s) => (s ? +s.slice(11, 13) + (+s.slice(14, 16)) / 60 : null);

function parse(raw) {
  const H = raw.hourly, D = raw.daily, hours = {}, days = {};
  H.time.forEach((t, i) => {
    const date = t.slice(0, 10), h = +t.slice(11, 13), code = H.weather_code[i];
    const mm = H.precipitation[i] == null ? 0 : H.precipitation[i];
    const p = H.precipitation_probability[i];
    const temp = H.temperature_2m[i];
    (hours[date] = hours[date] || [])[h] = {
      h, temp, feel: H.apparent_temperature[i] == null ? temp : H.apparent_temperature[i],
      pp: p == null ? (isRainCode(code) ? 65 : mm >= 0.2 ? 45 : 8) : p,   // si falta la probabilidad, se estima con el código del cielo
      mm, code, wind: H.wind_speed_10m[i] || 0, gust: H.wind_gusts_10m[i] || 0, dir: H.wind_direction_10m[i] || 0
    };
  });
  D.time.forEach((date, i) => {

  const bd = band(r.best.sc), tramo = a.h + ' a ' + (b.h + 1) + ' h';
  const night = a.dark || b.dark ? ' Aún es de noche.' : '';
  if (bd === 'bad') return 'Mejor evitar. Lo menos malo: de ' + tramo + '.' + night;
  return 'Mejor de ' + tramo + '. ' + RUN_VERDICT[bd] + '.' + night;
}

/* ---------- Salir a correr ---------- */
const isDark = (day, h) => day && day.rise != null && (h + 1 <= day.rise || h >= day.set);
function runScore(x, dark) {
  let p = dark ? 10 : 0;
  if (x.feel < 6) p += (6 - x.feel) * 5; else if (x.feel > 13) p += (x.feel - 13) * 6;
  p += x.pp * 0.5 + x.mm * 15;
  if (x.gust > 25) p += (x.gust - 25) * 0.8;
  return Math.max(0, Math.min(100, Math.round(100 - p)));
}
const band = (s) => (s >= 70 ? 'good' : s >= 45 ? 'ok' : 'bad');
const RUN_VERDICT = { good: 'Buen momento', ok: 'Regular', bad: 'Mejor evitar' };
function outfit(f) {
  if (f < 3)  return 'Mallas largas, térmica de manga larga, guantes y buff.';
  if (f < 9)  return 'Mallas largas y camiseta de manga larga.';
  if (f < 15) return 'Camiseta de manga larga fina y pantalón corto.';
  if (f < 21) return 'Camiseta de manga corta y pantalón corto.';
  return 'Tirantes y pantalón corto. Lleva agua y gorra, y evita las horas centrales.';
}
function bestRun(date, isToday) {
  const dayInfo = S.days[date];
  const hrs = (S.hours[date] || []).filter((x) => x && x.h >= 6 && x.h <= 22).map((x) => {
    const dark = isDark(dayInfo, x.h);
    return Object.assign({ dark, score: runScore(x, dark) }, x);
  });
  const first = isToday ? NOW.h + (NOW.m >= 30 ? 1 : 0) : 6;
  let best = null;
  for (let i = 0; i < hrs.length - 1; i++) {
    if (hrs[i].h < first) continue;
    const sc = (hrs[i].score + hrs[i + 1].score) / 2;
    if (!best || sc > best.sc + 0.01) best = { sc, a: hrs[i], b: hrs[i + 1] };
  }
  return best ? { hrs, first, best } : null;
}
function renderRun(date, isToday) {
  const r = bestRun(date, isToday);
  if (!r) return '<p class="msg">Por hoy ya no quedan horas para salir. Mira mañana.</p>';
  const { hrs, first, best } = r;

  const pair = [best.a, best.b];
  const feel = (best.a.feel + best.b.feel) / 2;
  const pp = Math.max(best.a.pp, best.b.pp);
  const gust = Math.max(best.a.gust, best.b.gust);
  const wind = (best.a.wind + best.b.wind) / 2;
  const dir = best.a.gust >= best.b.gust ? best.a.dir : best.b.dir;
  const bd = band(best.sc);
  let tips = outfit(feel);
  if (pp >= 50) tips += ' Cortavientos impermeable.';
  if (gust >= 45 && isCierzo(dir)) tips += ' Con cierzo fuerte, sal contra el viento para volver con él a favor.';
  if (best.a.dark || best.b.dark) tips += ' Aún es de noche: lleva frontal o algo reflectante.';

  const bars = hrs.map((x) => {
    const inBest = pair.indexOf(x) !== -1;
    return '<div class="col' + (x.h < first ? ' past' : '') + (x.dark ? ' dark' : '') + (inBest ? ' best' : '') + '" title="' + x.h + ':00 · ' + fmt(x.feel) + ' °C · lluvia ' + x.pp + ' %">' +
      '<div class="bar ' + band(x.score) + '" style="height:' + (10 + Math.round(x.score * 0.5)) + 'px"></div><span>' + x.h + '</span></div>';
  }).join('');
  const hasDark = hrs.some((x) => x.dark);

  return '<article class="card">' +
    '<div class="run-top"><div><div class="when">Mejor momento</div><div class="window">' + best.a.h + '–' + (best.b.h + 1) + ' h</div></div>' +
    '<span class="pill ' + bd + '">' + RUN_VERDICT[bd] + '</span></div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + deg(feel) + '</b><span>Sensación</span></div>' +
      '<div class="stat"><b>' + pp + ' %</b><span>Lluvia</span></div>' +
      '<div class="stat"><b>' + windLabel(dir, wind) + '</b><span>Viento</span></div>' +
    '</div>' +
    '<p class="outfit"><b>Ponte:</b> ' + tips + '</p>' +
    '<div class="strip" role="img" aria-label="Calidad de cada hora para correr, de 6 a 22 horas. Barra alta, mejor hora.">' + bars + '</div>' +
    '<div class="legend"><span><i style="background:var(--good)"></i>Bien</span><span><i style="background:var(--warn)"></i>Regular</span><span><i style="background:var(--bad)"></i>Mejor evitar</span>' +
    (hasDark ? '<span>Rayadas: de noche</span>' : '') + '<span>Con borde: tu tramo</span></div>' +
    '</article>';
}

/* ---------- Fin de semana ---------- */
function weekendDates() {
  const d = dow(NOW.date);
  const sat = d === 6 ? NOW.date : d === 0 ? addDays(NOW.date, 6) : addDays(NOW.date, 6 - d);
  return { sat, sun: addDays(sat, 1), next: d === 0 };
}
function outing(a) {
  let p = a.pp * 0.6 + a.mm * 8;
  if (a.feelAvg < 6) p += (6 - a.feelAvg) * 4;
  if (a.feelAvg > 28) p += (a.feelAvg - 28) * 6;
  if (a.gust > 30) p += (a.gust - 30) * 1.2;
  return Math.max(0, Math.round(100 - p));
}
const OUT_VERDICT = { good: 'Bueno para salir', ok: 'Aceptable', bad: 'Mejor plan de interior' };
function outingReason(a, m, t) {
  if (m.pp < 30 && t.pp >= 50) return 'Seco por la mañana, lluvia por la tarde';
  if (m.pp >= 50 && t.pp < 30) return 'Lluvia por la mañana, seco por la tarde';
  const r = [];
  if (a.pp >= 50) r.push('lluvia probable'); else if (a.pp >= 30) r.push('puede llover');
  if (a.feelAvg < 6) r.push('frío'); else if (a.feelAvg > 28) r.push('calor');
  if (a.gust >= 45) r.push(isCierzo(a.dir) ? 'cierzo fuerte' : 'viento fuerte');
  return r.length ? cap(r.join(', ')) : 'Seco y sin viento fuerte';
}
function dayInfo(date) {
  const d = S.days[date], m = agg(date, 10, 14), t = agg(date, 15, 19), o = agg(date, 10, 19);
  if (!d || !m || !t || !o) return null;
  const sm = outing(m), st = outing(t);
  const sc = Math.round(0.65 * Math.max(sm, st) + 0.35 * Math.min(sm, st));   // un buen tramo del día cuenta más que uno malo
  return { date, d, m, t, o, sc, bd: band(sc), reason: outingReason(o, m, t), ahead: daysBetween(NOW.date, date) };
}
function weekendInfo() {
  const w = weekendDates(), a = dayInfo(w.sat), b = dayInfo(w.sun);
  if (!a || !b) return null;
  let hl, short;
  if (Math.max(a.sc, b.sc) < 45) { hl = 'Los dos días vienen mal para salir.'; short = 'Mal tiempo los dos días'; }
  else if (Math.abs(a.sc - b.sc) < 10) {
    if (Math.min(a.sc, b.sc) >= 70) { hl = 'Los dos días valen para salir.'; short = 'Valen los dos días'; }
    else { hl = 'Los dos días son parecidos.'; short = 'Días parecidos'; }
  } else { const best = a.sc > b.sc ? 'sábado' : 'domingo'; hl = 'Mejor día para salir: ' + best + '.'; short = 'Mejor: ' + best; }
  return { w, a, b, hl, short, title: w.next ? 'Próximo fin de semana' : 'Este fin de semana', better: a.sc >= b.sc ? a : b };
}
function weekendCard(di) {
  const { date, d, m, t, o } = di;
  const g = garment(o.feelAvg);
  const hrs = (S.hours[date] || []).filter((x) => x && x.h >= 8 && x.h <= 20);
  const bars = hrs.map((x) => '<div class="rcol" title="' + x.h + ':00 · lluvia ' + x.pp + ' %"><div class="rbar" style="height:' + (4 + Math.round(x.pp * 0.42)) + 'px;opacity:' + (0.35 + x.pp / 160).toFixed(2) + '"></div><span>' + (x.h % 2 === 0 ? x.h : '') + '</span></div>').join('');
  const slot = (name, a) => '<div class="slot"><div class="small">' + name + '</div><div class="slotv">' + icon(a.code, 26) + '<b>' + deg(a.tempAvg) + '</b></div><div class="small">lluvia ' + a.pp + ' %</div></div>';
  return '<article class="card day">' +
    '<div class="dh"><div><div class="dname">' + dateLabel(date, { weekday: 'long' }) + '</div><div class="range">' + dateLabel(date, { day: 'numeric', month: 'long' }) + '</div></div>' +
    '<div class="dright">' + icon(d.code, 40) + '<div><div class="big sm">' + rng(d.tmin, d.tmax) + '</div><div class="small">' + TEXT[kind(d.code)] + '</div></div></div></div>' +
    '<div class="verdict"><span class="pill ' + di.bd + '">' + OUT_VERDICT[di.bd] + '</span><span class="small">' + di.reason + '</span></div>' +
    '<div class="two">' + slot('Mañana · 10–14 h', m) + slot('Tarde · 15–19 h', t) + '</div>' +
    '<div class="lbl">Lluvia por horas</div><div class="rstrip" role="img" aria-label="Probabilidad de lluvia de 8 a 20 horas">' + bars + '</div>' +
    '<div class="kidlbl"><span class="tag kid">Niños</span><span class="small">Qué ponerles ese día</span></div>' +
    '<div class="kidline">' + gicon(g.main, 40) + '<div class="chips"><span class="chip"><b>' + cap(g.main) + '</b></span>' + slotChips(o) + '</div></div>' +
    (di.ahead >= 5 ? '<p class="small far">Previsión a ' + di.ahead + ' días: puede cambiar.</p>' : '') +
    '</article>';
}
function teaser(wk) {
  const item = (lab, di) => '<span class="ti">' + lab + icon(di.d.code, 24) + '<b>' + fmt(di.d.tmax) + '°</b></span>';
  return '<button type="button" class="card teaser" id="to-weekend"><div class="when">' + wk.title + '</div>' +
    '<div class="trow">' + item('Sáb ', wk.a) + item('Dom ', wk.b) + '</div><div class="tverdict">' + wk.short + ' ›</div></button>';
}

/* ---------- Pintar la página ---------- */
function safe(fn, what) {

}
function heroHtml(o) {

}
const RUNNER = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="4.5" r="1.9"/><path d="M12.5 8.5l-2.8 3 3 2.4-1.4 5.6M12.5 8.5l3.6 2.2 2.4-1.2M9.7 11.5L6 12.6M13.1 14.1l3.6 1.9-.6 4.2"/></svg>';
function sectionHead(kindName, title, sub) {

function setHero(skyName, html) { $('hero').setAttribute('data-sky', skyName); $('hero-body').innerHTML = html; }

function renderDayView() {
  const isToday = view === 'today';

  }

  if (isToday) {
    const hr = (S.hours[date] || [])[NOW.h];
    const c = S.current || (hr ? { temp: hr.temp, feel: hr.feel, code: hr.code, night: isDark(day, NOW.h) } : { temp: day.tmax, feel: day.tmax, code: day.code, night: false });
    o = { icon: icon(c.code, 92, c.night), big: fmt(c.temp) + '°', txt: TEXT[kind(c.code)], sub: 'Hoy ' + rng(day.tmin, day.tmax),

  }));

/* ---------- Semana ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const listJoin = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1] : a[0] || '');
const DROP = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5C8.5 8 5.5 11.2 5.5 15a6.5 6.5 0 0 0 13 0c0-3.8-3-7-6.5-12.5z"/></svg>';
const PIN = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
const CAL = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';

function dayName(date) {
  if (date === NOW.date) return 'hoy';
  if (date === addDays(NOW.date, 1)) return 'mañana';
  return 'el ' + dateLabel(date, { weekday: 'long' });
}
/* Prenda del día para los niños: la que toca en el momento más fresco del cole. */
function kidsDayGarment(date) {

  if (!fs.length) return null;
  const cold = fs.reduce((m, x) => (x.feelAvg < m.feelAvg ? x : m));

}
function dayRow(d, o) {

  } else last = '<span class="wl">' + fmt(d.gust) + ' km/h</span>';

    '<div class="wd"><b>' + wd + '</b><span>' + sub + '</span></div>' +
    '<div title="' + TEXT[kind(d.code)] + '">' + icon(d.code, 28, false) + '</div>' +
    '<div class="wt"><b>' + fmt(d.tmax) + '°</b><span>' + fmt(d.tmin) + '°</span></div>' +
    '<div class="wr' + (d.pp >= 50 ? ' hi' : '') + '">' + DROP + (d.est ? '~' : '') + d.pp + '%</div>' + last + '</div>';
}
const whead = (lastLabel, kids) => '<div class="whead"><span>Día</span><span></span><span>Temp.</span><span>Lluvia</span>' +
  (kids ? '<span><span class="tag kid">Niños</span></span>' : '<span>' + lastLabel + '</span>') + '</div>';

function renderWeekView() {
  const days = [];
  for (let i = 0; i < 7; i++) { const d = S.days[addDays(NOW.date, i)]; if (d) days.push(d); }
  if (days.length < 3) { setHero('cloud', '<h1>Aún no hay previsión para la semana.</h1>'); $('view').innerHTML = ''; return; }

  setHero(skyOf(days[0].code, false), heroHtml({ icon: icon(days[0].code, 92, false), big: rng(tmin, tmax), bigSm: true, txt: 'Próximos 7 días', sub: '', meta: '', headline: hl }));

    '<p class="small far">Los días lejanos cambian más. Para el detalle, mira Hoy o Mañana.</p></section>';
}

/* ---------- Viaje ---------- */
const TRIP_KEY = 'tiempo-zgz-viaje';
const GEO = (q) => 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=6&language=es&format=json';
const TRIP_API = (p) => 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max&timezone=auto&forecast_days=16&wind_speed_unit=kmh';
const T = { q: '', results: null, busy: '', err: '', place: null, days: null, from: '', to: '', recents: [] };
try { T.recents = JSON.parse(localStorage.getItem(TRIP_KEY) || '[]').filter((p) => p && typeof p.lat === 'number' && typeof p.lon === 'number'); } catch (e) {}

const placeLabel = (p) => [p.region, p.country].filter(Boolean).join(', ');
function parseTrip(D) {
  return D.time.map((date, i) => {
    const code = D.weather_code[i], mm = D.precipitation_sum[i] || 0, p = D.precipitation_probability_max[i];
    return { date, code, tmax: D.temperature_2m_max[i], tmin: D.temperature_2m_min[i], mm, gust: D.wind_gusts_10m_max[i] || 0,
      pp: p == null ? (isRainCode(code) ? 65 : mm >= 1 ? 45 : 10) : p, est: p == null };
  });
}
async function tripSearch(q) {
  q = (q || '').trim(); T.q = q;
  if (q.length < 2) { T.err = 'Escribe al menos dos letras.'; T.results = null; return renderTrip(); }
  T.busy = 'Buscando…'; T.err = ''; T.results = null; renderTrip();
  try {
    const r = await fetch(GEO(q));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    T.results = (j.results || []).map((x) => ({ name: x.name, region: x.admin1 || '', country: x.country || '', lat: x.latitude, lon: x.longitude }));
    if (!T.results.length) T.err = 'No encuentro «' + q + '». Prueba con otro nombre o añade el país.';
  } catch (e) { T.err = 'No he podido buscar. Comprueba la conexión y vuelve a intentarlo.'; }
  T.busy = ''; renderTrip();
}
async function tripPick(p) {
  T.place = p; T.days = null; T.results = null; T.err = ''; T.busy = 'Cargando el tiempo de ' + p.name + '…'; renderTrip();
  try {
    const r = await fetch(TRIP_API(p));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    T.days = parseTrip(j.daily);
    const f = T.days[0].date, d = dow(f);
    const sat = d === 6 ? f : d === 0 ? addDays(f, 6) : addDays(f, 6 - d);   // por defecto, el próximo sábado y domingo
    T.from = sat; T.to = addDays(sat, 1);
    T.recents = [p].concat(T.recents.filter((x) => Math.abs(x.lat - p.lat) > 0.01 || Math.abs(x.lon - p.lon) > 0.01)).slice(0, 5);
    try { localStorage.setItem(TRIP_KEY, JSON.stringify(T.recents)); } catch (e) {}
  } catch (e) { T.err = 'No he podido cargar el tiempo de ' + p.name + '. Comprueba la conexión.'; T.place = null; }
  T.busy = ''; renderTrip();
}
function packList(ds) {
  const tmin = Math.min.apply(null, ds.map((d) => d.tmin)), tmax = Math.max.apply(null, ds.map((d) => d.tmax));
  const wet = ds.filter((d) => d.pp >= 50 || d.mm >= 2), windy = ds.filter((d) => d.gust >= 50);
  const swing = Math.max.apply(null, ds.map((d) => d.tmax - d.tmin));
  const out = [];
  if (tmin < 2) out.push({ t: 'Abrigo grueso, gorro y guantes' });
  else if (tmin < 7) out.push({ t: 'Abrigo y bufanda' });
  else if (tmin < 12) out.push({ t: 'Chaqueta gruesa' });
  else if (tmin < 17) out.push({ t: 'Sudadera o chaqueta fina' });
  if (tmax >= 27) out.push({ t: 'Ropa fresca, gorra y crema solar' });
  else if (tmax >= 22) out.push({ t: 'Ropa de manga corta' });
  if (wet.length) out.push({ t: 'Paraguas o chubasquero', alert: true });
  if (windy.length) out.push({ t: 'Cortavientos' });
  if (swing >= 12) out.push({ t: 'Ropa por capas: hay mucha diferencia entre el día y la noche' });
  if (!out.length) out.push({ t: 'Ropa ligera de entretiempo' });
  return out;
}
function renderTrip() {
  const typed = $('q'); if (typed) T.q = typed.value;   // no pierdas lo que ya has escrito si la página se repinta
  const head = sectionHead('trip', 'Tiempo de viaje', 'Busca una ciudad o un pueblo');
  const form = '<form id="tform" class="tform" autocomplete="off"><input id="q" type="search" name="q" value="' + esc(T.q) + '" placeholder="Lisboa, Benasque, Roma…" aria-label="Buscar un lugar" enterkeyhint="search"><button class="go" type="submit">Buscar</button></form>';
  const rec = T.recents.length ? '<div class="rec"><span class="small">Recientes</span>' + T.recents.map((p, i) => '<button type="button" class="chip btn" data-act="recent" data-i="' + i + '">' + esc(p.name) + '</button>').join('') + '</div>' : '';
  const status = T.busy ? '<p class="small far">' + esc(T.busy) + '</p>' : T.err ? '<p class="msg err">' + esc(T.err) + '</p>' : '';
  const res = T.results && T.results.length ? '<ul class="res">' + T.results.map((p, i) => '<li><button type="button" data-act="pick" data-i="' + i + '"><b>' + esc(p.name) + '</b><span>' + esc(placeLabel(p)) + '</span></button></li>').join('') + '</ul>' : '';
  let body = '';
  if (T.place && T.days && T.days.length) {
    const ds = T.days.filter((d) => d.date >= T.from && d.date <= T.to), use = ds.length ? ds : T.days.slice(0, 3);
    const tmin = Math.min.apply(null, use.map((d) => d.tmin)), tmax = Math.max.apply(null, use.map((d) => d.tmax));
    const wet = use.filter((d) => d.pp >= 50 || d.mm >= 2);
    const first = use[0], last = use[use.length - 1];
    const dd = (date, month) => dateLabel(date, { weekday: 'short' }).replace('.', '') + ' ' + dateLabel(date, { day: 'numeric' }) + (month ? ' de ' + dateLabel(date, { month: 'long' }) : '');
    const sameMonth = first.date.slice(0, 7) === last.date.slice(0, 7);
    const range = first.date === last.date ? cap(dateLabel(first.date, { weekday: 'long', day: 'numeric', month: 'long' }).replace(', ', ' ')) :
      'Del ' + dd(first.date, !sameMonth) + ' al ' + dd(last.date, true);
    let hl = wet.length ? 'Lluvia ' + listJoin(wet.map((d) => 'el ' + dateLabel(d.date, { weekday: 'long' }))) + '.' : 'Sin lluvia prevista.';
    hl += ' Entre ' + fmt(tmin) + '° y ' + fmt(tmax) + '°.';
    setHero(skyOf(first.code, false), heroHtml({ icon: icon(first.code, 92, false), big: rng(tmin, tmax), bigSm: true, txt: T.place.name, sub: '', meta: range, headline: hl }));
    const minD = T.days[0].date, maxD = T.days[T.days.length - 1].date;
    const chips = packList(use).map((c) => '<span class="chip' + (c.alert ? ' alert' : '') + '">' + (c.alert ? UMB : '') + c.t + '</span>').join('');
    body = '<article class="card tripcard"><div class="dname">' + esc(T.place.name) + '</div><div class="range">' + esc(placeLabel(T.place)) + '</div>' +
      '<div class="dates"><label for="d1">Desde<input type="date" id="d1" value="' + T.from + '" min="' + minD + '" max="' + maxD + '"></label>' +
      '<label for="d2">Hasta<input type="date" id="d2" value="' + T.to + '" min="' + minD + '" max="' + maxD + '"></label></div>' +
      '<div class="lbl">Qué llevar en la maleta</div><div class="packs">' + chips + '</div>' +
      '<div class="lbl">Día a día</div>' + whead('Racha', false) +
      safe(() => T.days.map((d) => dayRow(d, { last: 'wind', weekend: false, sel: d.date >= T.from && d.date <= T.to })).join(''), 'los días') +
      '<p class="small far">Pasada una semana, la previsión es aproximada. El signo ~ marca una lluvia estimada.</p></article>';
  } else {
    setHero('clear', heroHtml({ icon: icon(2, 92, false), big: 'Viaje', bigSm: true, txt: 'El tiempo en otro sitio', sub: '', meta: '', headline: 'Busca el lugar y mira el tiempo que te espera.' }));
  }
  $('view').innerHTML = '<section class="tripsec" aria-labelledby="h-trip">' + head + form + rec + status + res + body + '</section>';
}

const VIEWS = ['today', 'tomorrow', 'week', 'weekend', 'trip'];
function render() {
  NOW = nowMadrid();
  VIEWS.forEach((v) => $('b-' + v).setAttribute('aria-pressed', String(view === v)));
  paintHeader();
  if (view === 'trip') return renderTrip();
  if (!S) return;
  if (view === 'weekend') renderWeekendView(); else if (view === 'week') renderWeekView(); else renderDayView();
}
function setView(v) {
  view = v;
  try { history.replaceState(null, '', '#' + Object.keys(HASHES).find((k) => HASHES[k] === v)); } catch (e) {}
  render();
}

/* ---------- Carga, caché y errores ---------- */
const timeOf = (ms) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(ms));
const dayOf = (ms) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'short' }).format(new Date(ms));

async function load() {
  setStamp('Actualizando…');
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    S = parse(raw); S.at = Date.now();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: S.at, raw })); } catch (e) {}
    setStamp('Actualizado a las ' + timeOf(S.at));
    render();
  } catch (err) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
    if (cached && cached.raw) {
      S = parse(cached.raw); S.at = cached.at;
      setStamp('Sin conexión. Datos de las ' + timeOf(S.at) + ' del ' + dayOf(S.at));
      render();
    } else {
      setHero('cloud', '<h1>No he podido cargar el tiempo.</h1>');
      setStamp('Ábrela en el navegador y con conexión. Desde una vista previa no puede pedir datos.');
    }
  }
}

$('refresh').addEventListener('click', () => { if (view === 'trip' && T.place) tripPick(T.place); else load(); });
$('b-today').addEventListener('click', () => setView('today'));
$('b-tomorrow').addEventListener('click', () => setView('tomorrow'));
$('b-week').addEventListener('click', () => setView('week'));
$('b-weekend').addEventListener('click', () => setView('weekend'));
$('b-trip').addEventListener('click', () => setView('trip'));
$('view').addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-act]');
  if (b) {
    const i = +b.getAttribute('data-i'), act = b.getAttribute('data-act');
    if (act === 'pick' && T.results && T.results[i]) tripPick(T.results[i]);
    if (act === 'recent' && T.recents[i]) tripPick(T.recents[i]);
    return;
  }
  if (e.target.closest && e.target.closest('#to-weekend')) setView('weekend');
});
$('view').addEventListener('submit', (e) => { if (e.target.id === 'tform') { e.preventDefault(); tripSearch($('q').value); } });
$('view').addEventListener('change', (e) => {
  if (e.target.id !== 'd1' && e.target.id !== 'd2') return;
  const a = $('d1').value, b = $('d2').value;
  if (a) T.from = a;
  if (b) T.to = b;
  if (T.to < T.from) T.to = T.from;
  renderTrip();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && Date.now() - S.at > 30 * 60 * 1000) load(); });

const fromHash = HASHES[(location.hash || '').replace('#', '')];
view = fromHash || (nowMadrid().h >= 15 ? 'tomorrow' : 'today');  // por la tarde interesa más mañana
load();
</script>
